  <text x="88" y="44" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-weight="900" font-size="28" fill="#F8FAFC" letter-spacing="0.12em">VYRO</text>
  
  <!-- Brand Tagline -->
  <text x="89" y="60" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-weight="500" font-size="9" fill="#94A3B8" letter-spacing="0.22em">A NEW SPACE FOR CONVERSATIONS</text>
</svg>
